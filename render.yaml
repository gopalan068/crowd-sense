services:
  - type: web
    name: crowdsense-app
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: CCTV_USE_CACHE
        value: "true"
      - key: OVERRIDE_MODE
        value: precomputed
      - key: ENABLE_OPTICAL_FLOW
        value: "true"
      - key: PIPELINE_ACTIVE
        value: "false"
      - key: STREAM_WIDTH
        value: "640"
      - key: STREAM_QUALITY
        value: "70"
      - key: STREAM_MAX_FPS
        value: "15"
      - key: GROQ_API_KEY
        sync: false

